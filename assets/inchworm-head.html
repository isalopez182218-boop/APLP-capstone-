<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>APLP inchworm head</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

e="lo" d="M222.1 301L227.3 296.7L246.7 301.3M246.7 316.1L241.6 320.4L222.1 315.9M246.7 301.3L246.7 316.1M222.1 301L222.1 315.9"/></g><g class="iso-solid"><path class="iso-fill" d="M232.9 300.5L234 299.7L243.7 301.9L243.7 310.2L242.7 311.1L232.9 308.8Z"/><path class="iso-shade" data-shade="0" d="M243.7 310.2L242.7 311.1L242.7 302.8L243.7 301.9Z"/><path class="iso-shade" data-shade="2" d="M242.7 311.1L232.9 308.8L232.9 300.5L242.7 302.8Z"/><path class="iso-top" d="M243.7 301.9L242.7 302.8L232.9 300.5L234 299.7Z"/><path class="iso-line iso-crease" data-tone="faint" d="M243.7 301.9L242.7 302.8L232.9 300.5"/><path class="iso-line iso-edge" data-tone="mid" d="M232.9 300.5L234 299.7L243.7 301.9M243.7 310.2L242.7 311.1L232.9 308.8M243.7 301.9L243.7 310.2M232.9 300.5L232.9 308.8"/></g></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Burr: the only part that cuts</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Raised jaws are gripping; flat jaws are open or in light guide contact</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>6 actuators: M1 spindle, M2 ring, M3 feed screw, depth, clamp A, clamp B</span></span><span class="iso-caption">Next-rev idea, not the 17 Nov prototype. The head is the v4 ring module with clamp A fixed just above the cut, so the cable is held right where it is cut. Clamp B rides two rods on a 40 mm Tr8×2 stroke. While B grips, M3 pulls the head up 40 mm and the burr cuts one band at full depth; then A grips, B opens and walks 40 mm ahead, and B grips again. Both clamps always sit on uncut insulation. Four bands strip 6 in; the tour shows two and loops. Length about 180–200 mm against v4's 316 mm. Jaws are drawn as the v4 V-jaw vise; the next rev would use spring-closed, motor-opened jaws. Real cutting is ±190° strokes with small feed steps; the tour blends them and runs fast.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }

    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);
            run = null;
        }
    }
    if (run)
        runs.push(run);
    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;
    const count = ring.length;
    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {

const signedArea = (points) => points.reduce((sum, [x, y], index) => {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

// draws the cable between z0 and z1, with the peeled band [p0, p1] at radius rp
function cable(z0, z1, peel, P) {
  if (z1 <= z0) return "";
  const cuts = [z0, z1];
  if (peel) for (const z of [peel[0], peel[1]]) if (z > z0 && z < z1) cuts.push(z);
  cuts.sort((a, b) => a - b);
  let out = "";
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i];
    const b = cuts[i + 1];
    const mid = (a + b) / 2;
    const peeled = peel && mid > peel[0] && mid < peel[1];
    const r = peeled ? peel[2] : D.cableR;
    out += S(cylinder(0, 0, r, a, b - a, P, 72), { tone: peeled ? "lo" : "mid", crease: "none" });
    if (peeled) out += L(sideArc(0, 0, r, Math.min(b, a + 2), P, 40), { tone: "faint" });
  }
  return out;
}

// cut end of the cable: conductor, screen and insulation seen in section
function cableCap(z, P) {
  const rings = [[D.cableR - 0.6, "faint"], [D.cableR - 7.4, "lo"], [D.cableR - 8.4, "faint"], [12.4, "lo"]];
  let out = "";
  for (const [r, tone] of rings) out += L(onTop(circleRing(0, 0, r, 64), z, P, true), { tone });
  out += S(cylinder(0, 0, 12.4, z, 0.01, P, 48), { tone: "lo", crease: "none", flat: true });
  const strands = [];
  for (let ring2 = 0; ring2 < 3; ring2++) {
    const n = [1, 6, 12][ring2];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + ring2 * 0.2;
      strands.push(iso([Math.cos(a) * ring2 * 4.6, Math.sin(a) * ring2 * 4.6, z], P));
    }
  }
  out += dotsSvg(strands, { size: 0.9, tone: "mid" });
  return out;
}

// ---------- frame plates ----------
function platePoly() {
  const h = D.half;
  const c = 6;
  const s = D.slotHalf;
  return [[s, -h], [h - c, -h], [h, -h + c], [h, h - c], [h - c, h], [-h + c, h], [-h, h - c], [-h, -h + c], [-h + c, -h], [-s, -h], ...arc(s, Math.PI, 0, 24)];
}

function plate(z0, z1, P) {
  const dots = [[-66, -66], [66, -66], [66, 66], [-66, 66]].map(([x, y]) => iso([x, y, z1], P));
  return box(platePoly(), z0, z1 - z0, P, { tone: "mid" }, false) + dotsSvg(dots, { size: 0.55, tone: "lo" });
}

function platePieces(z0, z1, P, back, label) {
  const V = towardViewer(P);
  const poly = platePoly();
  const piece = clipHalf(poly, V, !back);
  let out = box(piece, z0, z1 - z0, P, { tone: "mid" }, false);
  if (!back) {
    const corners = [[-66, -66], [66, -66], [66, 66], [-66, 66]].filter(([x, y]) => x * V[0] + y * V[1] >= 0);
    out += dotsSvg(corners.map(([x, y]) => iso([x, y, z1], P)), { size: 0.55, tone: "lo" });
  } else {
    const corners = [[-66, 66], [66, 66]];
    out += dotsSvg(corners.map(([x, y]) => iso([x, y, z1], P)), { size: 0.55, tone: "lo" });
  }
  return out;
}

// ---------- end vise (M5) ----------
// jaw face offset a: 16.5 = clamped on 2 in, 30 = open
function vise(T, a, P, gearPhase, tag, jawTone = "hi") {
  const V = towardViewer(P);
  const zc = T + 7;
  const items = [];
  const jaw = (sign) => {
    const pts = [[-a - 28, -20], [-a, -20], [-a - 16, 0], [-a, 20], [-a, 54], [-a - 28, 54]].map(([x, y]) => [x * sign, y]);
    const back = rect([1, 0], [0, 1], sign > 0 ? a + 2 : -a - 26, sign > 0 ? a + 26 : -a - 2, 54, 56.5);
    const svg = box(pts, T, 14, P, { tone: jawTone }, false) + box(back, T, 14, P, { tone: "mid" }) +
      dotsSvg([[sign * (a + 8), 55.2], [sign * (a + 20), 55.2]].map(([x, y]) => iso([x, y, T + 14], P)), { size: 0.4, tone: "lo" }) +
      L(onTop([[sign * (a + 3), 40], [sign * (a + 25), 40]], T + 14, P), { tone: "faint" });
    items.push({ d: dep(sign * (a + 14), 18, P), svg });
  };
  jaw(-1);
  jaw(1);
  // M6 LH/RH screw and the 6 mm guide, along x
  const rod = (y, r, x0, x1, tone) => {
    if (x1 <= x0) return;
    const F = frameOf([x0, y, zc], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
    items.push({ d: dep((x0 + x1) / 2, y, P) - 0.5, svg: S(disc(0, x1 - x0, r, F, P), { tone, crease: "none" }) });
  };
  for (const [x0, x1] of [[-70, -a - 28], [-a, -3.4], [3.4, a], [a + 28, 70]]) {
    rod(48, 3, x0, x1, "mid");
    rod(31.2, 3, x0, x1, "lo");
  }
  // screw end blocks
  for (const x of [-73, 70]) items.push({ d: dep(x + 1.5, 40, P), svg: box(rect([1, 0], [0, 1], x, x + 3, 26, 54), T, 14, P, { tone: "mid" }) });
  // 40T on the screw, 20T above it on the N20 shaft
  const g40 = frameOf([-3.4, 48, zc], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
  const g20 = frameOf([-3.4, 60.6, zc], [1, 0, 0], [0, 1, 0], [0, 0, 1]);
  items.push({
    d: dep(0, 48, P) + 0.2,
    svg: S(disc(0, 6.8, 8.4, g40, P), { tone: "hi" }) + L(ribsOf(g40, 0.2, 6.6, 8.4, 40, P, { phase: gearPhase }), { tone: "faint" }),
  });
  items.push({
    d: dep(0, 60.6, P) + 0.3,
    svg: S(disc(0, 6.8, 4.4, g20, P), { tone: "hi" }) + L(ribsOf(g20, 0.2, 6.6, 4.4, 20, P, { phase: -2 * gearPhase }), { tone: "faint" }),
  });
  // N20 gearmotor (M5) along +x behind the 20T: gearbox 9 + motor 25, 12 x 10 section
  const n20 = rect([1, 0], [0, 1], 3.4, 12.4, 54.6, 66.6);
  const n20m = rect([1, 0], [0, 1], 12.4, 37.4, 55.6, 65.6);
  items.push({
    d: dep(20, 60.6, P) + 0.4,
    svg: box(n20, zc - 5, 10, P, { tone: "mid" }) + box(n20m, zc - 5, 10, P, { tone: "hi" }) +
      box(rect([1, 0], [0, 1], 37.4, 39.4, 57.6, 63.6), zc - 3, 6, P, { tone: "lo" }) +
      faceTextSvg(topMatrix([18, 58.6], zc + 5, P, "y"), tag, { size: 3.2, tone: "lo" }),
  });
  // S12 open-stop switches
  for (const s of [-1, 1]) {
    const x = s * 61;
    items.push({ d: dep(x, 8, P), svg: box(rect([1, 0], [0, 1], x - 3, x + 3, 2, 14), T, 9, P, { tone: "lo" }) + box(rect([1, 0], [0, 1], x - 4.5 * s - 0.6, x - 4.5 * s + 0.6, 5, 11), T + 2, 5, P, { tone: "mid" }) });
  }
  items.sort((p, q) => p.d - q.d);
  return items;
}

// ---------- pulley stack ----------
function pulley(x, y, z0, P, phase) {
  // hub 7 below, flange, 6 mm belt wrap, flange
  let out = S(cylinder(x, y, 6.2, z0 - 7, 7, P, 28), { tone: "mid" });
  out += S(cylinder(x, y, 6.6, z0, 1, P, 28), { tone: "mid" });
  out += S(cylinder(x, y, 5.9, z0 + 1, 6, P, 28), { tone: "lo", crease: "none" });
  out += S(cylinder(x, y, 6.6, z0 + 7, 1, P, 28), { tone: "mid" });
  out += L(lineOnTop([x + 2.6 * Math.cos(phase), y + 2.6 * Math.sin(phase)], [x + 6 * Math.cos(phase), y + 6 * Math.sin(phase)], z0 + 8, P), { tone: "hi" });
  return out;
}

function beltSpans(a, b, r, z0, P) {
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const len = Math.hypot(dx, dy);
  const n = [-dy / len, dx / len];
  let out = "";
  for (const s of [-1, 1]) {
    const o = [n[0] * r * s, n[1] * r * s];
    out += box(bar([a[0] + o[0], a[1] + o[1]], [b[0] + o[0], b[1] + o[1]], 1.4), z0 + 1, 6, P, { tone: "lo", crease: "none" });
  }
  return out;
}

// ---------- the orbiting head on the ring ----------
function head(theta, tipR, zf, P) {
  const V = towardViewer(P);
  const phi = Math.PI / 2 + theta;
  const u = [Math.cos(phi), Math.sin(phi)];
  const t = [-u[1], u[0]];
  const facing = u[0] * V[0] + u[1] * V[1] > 0;
  const z = (v) => v + zf;
  const parts = {};
  parts.base = box(rect(u, t, 32, 50, -20, 20), z(139.7), 4, P, { tone: "mid" }) +
    dotsSvg([[34.5, -16.5], [34.5, 16.5], [47.5, -16.5], [47.5, 16.5]].map(([r, s]) => iso([u[0] * r + t[0] * s, u[1] * r + t[1] * s, z(143.7)], P)), { size: 0.4, tone: "lo" });
  const cheek = (s) => box(rect(u, t, 32, 50, s > 0 ? 12.5 : -20, s > 0 ? 20 : -12.5), z(143.7), 13.3, P, { tone: "mid" });
  const nearSign = t[0] * V[0] + t[1] * V[1] > 0 ? 1 : -1;
  parts.far = cheek(-nearSign);
  parts.near = cheek(nearSign);
  const U3 = [u[0], u[1], 0];
  const T3 = [t[0], t[1], 0];
  const Fs = frameOf([0, 0, z(146.4)], U3, T3, [0, 0, 1]);
  const Fb = frameOf([0, 0, z(157)], U3, T3, [0, 0, 1]);
  parts.screwIn = S(disc(35, 49, 2, Fs, P), { tone: "mid", crease: "none" }) + L(ribsOf(Fs, 35.5, 48.5, 2, 10, P, { twist: 1.2 }), { tone: "faint" });
  parts.collar = S(disc(46.6, 48.6, 3.5, Fs, P), { tone: "mid" });
  parts.bridge = box(rect(u, t, 49, 52, -12.5, 12.5), z(143.7), 5.3, P, { tone: "hi" }) +
    dotsSvg([[50.5, -9.5], [50.5, 9.5]].map(([r, s]) => iso([u[0] * r + t[0] * s, u[1] * r + t[1] * s, z(149)], P)), { size: 0.45, tone: "lo" });
  parts.screwOut = S(disc(52, 54, 2, Fs, P), { tone: "mid" }) + S(disc(52.5, 53.1, 2.15, Fs, P), { tone: "lo", crease: "none" });
  const c0 = tipR + 20;
  parts.carrier = box(rect(u, t, c0, c0 + 20, -12, 12), z(150), 25, P, { tone: "hi" }) +
    dotsSvg([[c0 + 3, -9], [c0 + 3, 9], [c0 + 17, -9], [c0 + 17, 9]].map(([r, s]) => iso([u[0] * r + t[0] * s, u[1] * r + t[1] * s, z(175)], P)), { size: 0.45, tone: "lo" });
  parts.collet = S(disc(tipR + 12, tipR + 20, 5.75, Fb, P), { tone: "mid" }) + S(disc(tipR + 16, tipR + 20, 5.9, Fb, P, { steps: 6 }), { tone: "mid" });
  parts.burr = S(disc(tipR, tipR + 12, 2, Fb, P), { tone: "hi", lit: true, crease: "none" }) + L(ribsOf(Fb, tipR + 0.4, tipR + 7, 2, 8, P, { twist: 1.6 }), { tone: "lo" });
  const mc = tipR + 32;
  const mx = u[0] * mc;
  const my = u[1] * mc;
  parts.m1 = S(cylinder(mx, my, 14, z(175), 21, P, 56, 0.8), { tone: "hi" }) +
    L([179, 183, 187].map((v) => sideArc(mx, my, 14, z(v), P, 40)).join(""), { tone: "faint" }) +
    S(cylinder(mx, my, 6, z(196), 2, P, 28), { tone: "mid" }) +
    S(cylinder(mx, my, 2.5, z(198), 1.6, P, 20), { tone: "lo" }) +
    faceTextSvg(topMatrix([mx - 4, my - 9.5], z(196), P, "y"), "M1", { size: 3.4, tone: "lo" });
  const order = facing
    ? ["base", "far", "burr", "collet", "screwIn", "collar", "bridge", "screwOut", "carrier", "near", "m1"]
    : ["base", "far", "screwOut", "bridge", "collar", "screwIn", "carrier", "m1", "collet", "burr", "near"];
  return { svg: order.map((k) => parts[k]).join(""), depth: dep(u[0] * 45, u[1] * 45, P) };
}

// ---------- ring gear ----------
function ringPoly(theta) {
  const phi = Math.PI / 2 + theta; // head direction
  const gapC = phi + Math.PI;
  const half = ((D.gapDeg / 2) * Math.PI) / 180;
  const a0 = gapC + half;
  const a1 = gapC - half + TAU;
  const pitch = TAU / 72;
  const first = Math.ceil((a0 - phi) / pitch + 0.5);
  const last = Math.floor((a1 - phi) / pitch - 0.5);
  const teethAt = [];
  for (let k = first; k <= last; k++) teethAt.push(phi + k * pitch);
  return {
    body: [...arc(D.ringTip, a0, a1, 120), ...arc(D.ringIn, a1, a0, 80)],
    rib: [...arc(D.ribR, a0, a1, 120), ...arc(D.ringIn, a1, a0, 80)],
    teethAt,
    phi,
  };
}

function ringTeeth(rp, z0, z1, P) {
  const V = towardViewer(P);
  let top = "";
  let side = "";
  for (const c of rp.teethAt) {
    const ca = Math.cos(c);
    const sa = Math.sin(c);
    top += lineOnTop([D.ringRoot * ca, D.ringRoot * sa], [D.ringTip * ca, D.ringTip * sa], z1, P);
    if (ca * V[0] + sa * V[1] > 0.12) side += segment([D.ringTip * ca, D.ringTip * sa, z1], [D.ringTip * ca, D.ringTip * sa, z0 + 0.6], P);
  }
  return L(top, { tone: "lo" }) + L(side, { tone: "faint" }) + L(onTop(arc(D.ringRoot, rp.teethAt[0] - 0.03, rp.teethAt[rp.teethAt.length - 1] + 0.03, 100), z1, P), { tone: "faint" });
}

// ---------- one frame of the inchworm head ----------
// s = { theta (rad), f (head travel, mm), s (clamp B offset above its home, 0..40), jawA, jawB (jaw face offset; 16.5 grip, 20 guide, 30 open),
//       toneA, toneB, tipR, peel: [p0, p1, r] | null, gearA, gearB }
const IW = { fMin: -60, fMax: 20, stroke: 40, top: 357 };
function frame(s, P) {
  const V = towardViewer(P);
  const f = s.f;
  const out = [];
  const add = (svg) => out.push(svg);
  const sorted = (items) => items.sort((p, q) => p.d - q.d).forEach((i) => add(i.svg));
  const peel = s.peel;
  const TOP = IW.top;
  const cab = (z0, z1) => (z1 <= z0 || z0 >= TOP ? "" : cable(z0, Math.min(z1, TOP), peel, P) + (z1 >= TOP ? cableCap(TOP, P) : ""));
  const pinPhase = (-s.theta * 72) / 14;
  const zA = 214 + f; // clamp A plate (fixed to the head)
  const zB = 262 + f + s.s; // clamp B plate (rides the rods on the Tr8 nut)
  const rodTop = 324 + f;
  const [sx, sy] = D.screw;

  // band 0: cable support stand
  add(`<path class="iso-halo" d="${haloOf({ x: -62, y: -62, w: 124, d: 124, r: 10 }, -30, 4, P)}"/>`);
  const feet = [[-52, -52], [52, -52], [52, 52], [-52, 52]].sort((a, b) => dep(...a, P) - dep(...b, P));
  for (const [x, y] of feet) add(S(cylinder(x, y, 6, -30, 4, P, 24), { tone: "lo" }));
  add(box(rect([1, 0], [0, 1], -60, 60, -60, 60), -26, 8, P, { tone: "lo" }) +
    dotsSvg([[-52, -52], [52, -52], [52, 52], [-52, 52]].map(([x, y]) => iso([x, y, -18], P)), { size: 0.5, tone: "mid" }) +
    L(onTop([[-50, -44], [-20, -44]], -18, P) + onTop([[-50, -48], [-28, -48]], -18, P), { tone: "faint" }));
  add(S(cylinder(0, 0, 33, -18, 18, P, 64, 0.8), { tone: "mid" }) + L(sideArc(0, 0, 33, -9, P, 48), { tone: "faint" }) +
    box(rect([0, -1], [1, 0], 30, 42, -7, 7), -16, 14, P, { tone: "mid" }) +
    dotsSvg([iso([0, -38, -2], P)], { size: 0.6, tone: "lo" }));

  // band 1: cable below the head
  add(cab(0, 95 + f));

  // band 4: head rear zone (link belt, M2 belt, pulleys)
  const b4 = [{ d: 0, svg: cab(95 + f, 112.3 + f) }];
  const zl = 96 + f;
  const zm = 103.5 + f;
  b4.push({ d: dep(0, 51, P) - 1, svg: beltSpans(D.pins[0], D.pins[1], 5.9, zl, P) });
  b4.push({ d: dep(52, -7, P) - 1, svg: beltSpans(D.pins[1], D.m2, 5.9, zm, P) });
  b4.push({ d: dep(...D.pins[0], P), svg: S(cylinder(...D.pins[0], 2.5, zl - 9, 30, P, 16), { tone: "lo", crease: "none" }) + pulley(...D.pins[0], zl, P, pinPhase) });
  b4.push({ d: dep(...D.pins[1], P), svg: S(cylinder(...D.pins[1], 2.5, zl - 9, 30, P, 16), { tone: "lo", crease: "none" }) + pulley(...D.pins[1], zl, P, pinPhase) + pulley(...D.pins[1], zm + 7.5, P, pinPhase) });
  b4.push({ d: dep(...D.m2, P), svg: S(cylinder(...D.m2, 2, zm - 2, 112 + f - zm + 2, P, 16), { tone: "lo", crease: "none" }) + pulley(...D.m2, zm, P, pinPhase) });
  sorted(b4);

  // band 5: back C plate with tabs to the two rods and M2
  const zb = 112.3 + f;
  const half = (35 * Math.PI) / 180;
  const bp = [...arc(60, -Math.PI / 2 + half, 1.5 * Math.PI - half, 96), ...arc(36, 1.5 * Math.PI - half, -Math.PI / 2 + half, 64)];
  const tabs = [
    { to: D.rods[0], end: 0, w: 16 },
    { to: D.rods[1], end: 0, w: 16 },
    { to: D.m2, end: 15, w: 18 },
  ].map(({ to, end, w }) => {
    const len = Math.hypot(...to);
    const dir = [to[0] / len, to[1] / len];
    return { front: dir[0] * V[0] + dir[1] * V[1] > 0, svg: box(bar([dir[0] * 50, dir[1] * 50], to, w, 0, end), zb, 7.7, P, { tone: "mid" }) };
  });
  tabs.filter((t) => !t.front).forEach((t) => add(t.svg));
  add(cab(zb, 120 + f));
  add(box(bp, zb, 7.7, P, { tone: "mid" }, false));
  tabs.filter((t) => t.front).forEach((t) => add(t.svg));
  // rod roots: a collar on each tab end
  for (const [x, y] of D.rods) add(S(cylinder(x, y, 9, zb + 7.7, 3, P, 32), { tone: "mid" }) + dotsSvg([iso([x + 7, y, zb + 10.7], P), iso([x - 7, y, zb + 10.7], P)], { size: 0.4, tone: "lo" }));

  // band 6: ring gear, pinions, V-rollers, rods
  const zg = 120 + f;
  const rp = ringPoly(s.theta);
  const b6back = [];
  for (const [x, y] of D.rods) b6back.push({ d: dep(x, y, P), svg: S(cylinder(x, y, 6, zb + 10.7, zA - zb - 10.7, P, 28), { tone: "mid", crease: "none" }) });
  D.pins.forEach(([x, y]) => {
    const tk = radialTicks(x, y, 12.3, 14, 1000, 139 + f, [1.8, 1.8], P, pinPhase);
    b6back.push({
      d: dep(x, y, P),
      svg: S(cylinder(x, y, 7, 123 + f, 4, P, 24), { tone: "mid" }) + S(cylinder(x, y, 12.3, 127 + f, 12, P, 42), { tone: "hi" }) +
        L(tk.minor + tk.major, { tone: "lo" }) +
        S(cylinder(x, y, 9, 139.7 + f, 3.3, P, 32, 0.5), { tone: "mid" }) + dotsSvg([iso([x, y, 143 + f], P)], { size: 0.6, tone: "lo" }),
    });
  });
  const rollers = [90, 210, 330].map((deg) => {
    const a = (deg * Math.PI) / 180;
    const x = 65 * Math.cos(a);
    const y = 65 * Math.sin(a);
    return {
      d: dep(x, y, P),
      svg: S(cylinder(x, y, 2.5, 120 + f, 8, P, 16), { tone: "lo", crease: "none" }) + S(cylinder(x, y, 8, 120.5 + f, 2.75, P, 32), { tone: "mid" }) + S(cylinder(x, y, 5.5, 123.25 + f, 0.5, P, 28), { tone: "lo" }) + S(cylinder(x, y, 8, 123.75 + f, 2.75, P, 32), { tone: "mid" }) + dotsSvg([iso([x, y, 126.5 + f], P)], { size: 0.5, tone: "lo" }),
    };
  });
  const back6 = [...b6back, ...rollers].filter((r) => r.d <= 8);
  const front6 = [...b6back, ...rollers].filter((r) => r.d > 8);
  sorted(back6);
  add(cab(zg, 139.7 + f));
  add(box(rp.rib, zg, 6, P, { tone: "mid" }, false) + box(rp.body, zg + 6, 13.7, P, { tone: "hi" }, false));
  add(ringTeeth(rp, zg + 6, zg + 19.7, P));
  const screws = [];
  for (let k = 0; k < 10; k++) {
    const a = rp.phi + Math.PI + ((D.gapDeg / 2 + 14 + k * 29.5) * Math.PI) / 180;
    screws.push(iso([44 * Math.cos(a), 44 * Math.sin(a), 139.7 + f], P));
  }
  add(dotsSvg(screws, { size: 0.5, tone: "lo" }));
  sorted(front6);

  // band 7: cable to clamp A, orbiting burr head, M2
  const b7 = [{ d: 0, svg: cab(139.7 + f, zA) }];
  const h = head(s.theta, s.tipR, f, P);
  b7.push({ d: h.depth, svg: h.svg });
  {

  });

    b11.push({
      d: dep(x, y, P),
      svg: S(cylinder(x, y, 6, zB + 16, rodTop - zB - 16, P, 28), { tone: "mid", crease: "none" }) +

    });

  sorted(b11);
  return out.join("");
}

function extents() {

const DEG = Math.PI / 180;
const CUT_R = 25.4 - 6, RET_R = 29.4, GRIP = 16.5, GUIDE = 20, OPEN = 30;
const ease = (x) => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
const lerp = (a, b, x) => a + (b - a) * ease(x);
const STEPS = [
  ["LOAD", 1.2], ["CLAMP B · A to guide", 1.0], ["DEPTH at HOME", 0.8],
  ["CUT band 1, B holds", 4.5], ["CLAMP A · OPEN B", 1.0], ["WALK B up 40 mm", 1.6], ["CLAMP B · A to guide", 1.0],
  ["CUT band 2, B holds", 4.5], ["HOME + retract", 1.0], ["OPEN A + B", 0.9], ["RESET", 1.6],
];
const LOOP = STEPS.reduce((a, s) => a + s[1], 0);
function tourAt(t) {
  const s = { theta: 0, f: -60, s: 40, jawA: OPEN, jawB: OPEN, toneA: "mid", toneB: "mid", tipR: RET_R, peelTop: null, band: 1, phase: "LOAD" };
  let u = t, i = 0;
  for (; i < STEPS.length; i++) { if (u < STEPS[i][1]) break; u -= STEPS[i][1]; }
  i = Math.min(i, STEPS.length - 1);
  const x = Math.min(1, u / STEPS[i][1]);
  s.phase = STEPS[i][0];
  const p0 = 157 + -60;
  const cut = (n, x) => {
    s.f = -60 + 40 * n + 40 * x; s.s = 40 - 40 * x;
    s.theta = 190 * DEG * Math.sin(2 * Math.PI * 3 * x);
    s.peelTop = 157 + s.f;
  };
  if (i >= 1) { s.jawB = i === 1 ? lerp(OPEN, GRIP, x) : GRIP; s.jawA = i === 1 ? lerp(OPEN, GUIDE, x) : GUIDE; s.toneB = "hi"; }
  if (i >= 2) s.tipR = i === 2 ? lerp(RET_R, CUT_R, x) : CUT_R;
  if (i === 3) cut(0, x);
  if (i >= 4) { s.f = -60 + 40; s.s = 0; s.peelTop = 157 + s.f; }
  if (i === 4) { s.jawA = lerp(GUIDE, GRIP, x); s.jawB = lerp(GRIP, OPEN, x); s.toneA = "hi"; s.toneB = x < 0.5 ? "hi" : "mid"; }
  if (i === 5) { s.jawA = GRIP; s.jawB = OPEN; s.toneA = "hi"; s.toneB = "mid"; s.s = 40 * ease(x); }
  if (i === 6) { s.s = 40; s.jawB = lerp(OPEN, GRIP, x); s.jawA = lerp(GRIP, GUIDE, x); s.toneB = "hi"; s.toneA = x < 0.5 ? "hi" : "mid"; }
  if (i >= 4 && i <= 6) s.band = 2;
  if (i === 7) { cut(1, x); s.band = 2; }
  if (i >= 8) { s.f = -60 + 80; s.s = 0; s.peelTop = 157 + s.f; s.band = 2; }
  if (i === 8) { s.tipR = lerp(CUT_R, RET_R, x); }
  if (i >= 9) s.tipR = RET_R;
  if (i === 9) { s.jawA = lerp(GUIDE, OPEN, x); s.jawB = lerp(GRIP, OPEN, x); s.toneB = "mid"; }
  if (i === 10) { s.jawA = OPEN; s.jawB = OPEN; s.toneB = "mid"; s.f = lerp(-60 + 80, -60, x); s.s = lerp(0, 40, x); s.peelTop = x < 0.5 ? s.peelTop : null; }
  s.peel = s.peelTop && s.peelTop > p0 + 0.5 ? [p0, s.peelTop, CUT_R] : null;
  const gear = (j) => ((OPEN - j) / 0.75) * 2 * Math.PI;
  s.gearA = gear(s.jawA); s.gearB = gear(s.jawB);
  return s;
}

const P = {"origin":[300,701.5467600524046],"scale":1.4519730142725586,"azimuth":-28,"elevation":26};
const stage = document.querySelector(".iso-stage");
